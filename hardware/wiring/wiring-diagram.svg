<text x="40" y="40" font-size="22" font-weight="700" fill="#1a202c">small_actuator: wiring overview</text>
<text x="40" y="62" font-size="13" fill="#4a5568">Pi 5 (ROS 2 master) with two Picos over USB. Pico A drives the NEMA 17 motors, Pico B drives the small joints. Pin numbers are GPIO names; see WIRING.md.</text>
